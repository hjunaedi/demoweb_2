<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="container">
        <a href="/" class="logo" id="logo">Loading...</a>
        <button onclick="toggleTheme()" class="btn" id="theme-btn">🌙</button>
    </nav>
    
    <header class="container" style="text-align:center; margin-bottom:40px;">
        <h1>Selamat Datang</h1>
        <p>Website Modern Tanpa Error</p>
    </header>

    <main class="container">
        <div id="loading" class="spinner"></div>
        <div id="grid" class="grid"></div>
    </main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
    <script>
        initApp();
        document.getElementById('logo').innerText = CONFIG.SITE_NAME;

        async function loadHome() {
            const data = await fetchAllData();
            // Filter hanya Post + Published
            const posts = data.filter(i => i.type === 'post' && i.status === 'Published');
            
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('grid');

            if(posts.length === 0) container.innerHTML = "<p>Belum ada artikel.</p>";

            posts.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <a href="/post/${p.slug}">
                            ${p.image_url ? `<img src="${p.image_url}" style="height:200px; width:100%; object-fit:cover;">` : ''}
                            <div class="card-body">
                                <span class="meta">${p.date} • ${p.category}</span>
                                <h3>${p.title}</h3>
                            </div>
                        </a>
                    </div>`;
            });
        }
        loadHome();
    </script>
</body>
</html>
