<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="container">
        <a href="/" style="font-weight:bold;">← Kembali</a>
        <button onclick="toggleTheme()" class="btn" id="theme-btn">🌙</button>
    </nav>

    <main class="container">
        <div id="loading" class="spinner"></div>
        
        <article id="content" style="display:none; max-width:800px; margin:0 auto;">
            <header class="post-header">
                <span id="p-cat" class="badge"></span>
                <h1 id="p-title" style="margin:15px 0; font-size:2rem;"></h1>
                <span id="p-date" class="meta"></span>
            </header>

            <img id="p-img" src="" style="display:none; width:100%; margin-bottom:30px;">
            <div id="p-body" class="post-content"></div>
        </article>
    </main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
    <script>
        initApp();

        async function loadPost() {
            // Ambil Slug (Membuang tanda / di awal/akhir)
            const path = window.location.pathname.replace(/^\/|\/$/g, '');
            const segments = path.split('/');
            const slug = segments[segments.length - 1]; // Ambil bagian paling belakang

            const data = await fetchAllData();
            // Cari data yang slug cocok DAN type='post'
            const item = data.find(x => x.slug === slug && x.type === 'post');

            document.getElementById('loading').style.display = 'none';

            if(item) {
                document.title = item.title;
                document.getElementById('content').style.display = 'block';
                document.getElementById('p-title').innerText = item.title;
                document.getElementById('p-cat').innerText = item.category;
                document.getElementById('p-date').innerText = item.date;
                document.getElementById('p-body').innerHTML = item.content;
                
                if(item.image_url) {
                    document.getElementById('p-img').src = item.image_url;
                    document.getElementById('p-img').style.display = 'block';
                }
            } else {
                document.querySelector('main').innerHTML = "<h1 style='text-align:center'>404 Artikel Tidak Ditemukan</h1>";
            }
        }
        loadPost();
    </script>
</body>
</html>
