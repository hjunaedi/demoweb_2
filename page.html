<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="container">
        <a href="/" style="font-weight:bold;">← Home</a>
        <button onclick="toggleTheme()" class="btn" id="theme-btn">🌙</button>
    </nav>

    <main class="container">
        <div id="loading" class="spinner"></div>
        <article id="content" style="display:none; max-width:800px; margin:0 auto;">
            <h1 id="p-title" style="border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:20px;"></h1>
            <div id="p-body" class="post-content"></div>
        </article>
    </main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
    <script>
        initApp();
        async function loadPage() {
            const path = window.location.pathname.replace(/^\/|\/$/g, '');
            const segments = path.split('/');
            const slug = segments[segments.length - 1];

            const data = await fetchAllData();
            // Cari data yang slug cocok DAN type='page'
            const item = data.find(x => x.slug === slug && x.type === 'page');

            document.getElementById('loading').style.display = 'none';

            if(item) {
                document.title = item.title;
                document.getElementById('content').style.display = 'block';
                document.getElementById('p-title').innerText = item.title;
                document.getElementById('p-body').innerHTML = item.content;
            } else {
                document.querySelector('main').innerHTML = "<h1 style='text-align:center'>404 Halaman Tidak Ditemukan</h1>";
            }
        }
        loadPage();
    </script>
</body>
</html>
